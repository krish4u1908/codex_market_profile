[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "banknifty-market-profiler"
version = "0.1.0"
description = "Verified BankNifty market-profiling diagnostic source baseline"
requires-python = ">=3.12"
dependencies = ["numpy==2.5.2", "pandas==3.0.5"]

[tool.setuptools.packages.find]
where = ["src"]
