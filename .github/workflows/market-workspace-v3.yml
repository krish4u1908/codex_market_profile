name: Market Workspace Realtime Preview
on:
  pull_request:
    paths: ['apps/market-workspace-v3/**', 'apps/market-core-v3/**', 'apps/market-realtime-preview/**', '.github/workflows/market-workspace-v3.yml']
  push:
    branches: [main]
    paths: ['apps/market-workspace-v3/**', 'apps/market-core-v3/**', 'apps/market-realtime-preview/**', '.github/workflows/market-workspace-v3.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/market-workspace-v3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/market-workspace-v3/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: python -m pip install -r ../market-core-v3/requirements.txt
      - run: python -m unittest discover -s tests -v
        working-directory: apps/market-core-v3
      - name: Verify isolated display reader
        run: python -B -m unittest discover -s tests -v
        working-directory: apps/market-realtime-preview
      - name: Build separate preview package
        run: python -B build_preview.py --output /tmp/market-workspace-realtime-preview.zip
        working-directory: apps/market-realtime-preview
      - name: Upload separate preview package
        uses: actions/upload-artifact@v4
        with:
          name: market-workspace-realtime-preview
          path: /tmp/market-workspace-realtime-preview.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
