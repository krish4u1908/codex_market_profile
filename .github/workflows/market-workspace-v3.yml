name: Market Workspace V3
on:
  pull_request:
    paths: ['apps/market-workspace-v3/**', 'apps/market-core-v3/**', '.github/workflows/market-workspace-v3.yml']
  push:
    branches: [main]
    paths: ['apps/market-workspace-v3/**', 'apps/market-core-v3/**', '.github/workflows/market-workspace-v3.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/market-workspace-v3
    steps:
      - uses: actions/checkout@v4
      - name: Materialize V3 OI-flow lineage
        run: |
          git -C ../.. apply apps/market-workspace-v3/patches/3.0.11-gui-minute-oi-flow.patch
          node scripts/materialize-gui-layout-3.0.12.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/market-workspace-v3/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Verify entry bubbles in desktop and mobile replay
        run: |
          npm install --prefix "$RUNNER_TEMP/entry-browser" --no-save --package-lock=false playwright@1.62.1
          export ENTRY_PLAYWRIGHT_MODULE="$RUNNER_TEMP/entry-browser/node_modules/playwright/index.mjs"
          export ENTRY_UI_OUTPUT="$RUNNER_TEMP/entry-ui"
          if command -v google-chrome >/dev/null; then
            export ENTRY_CHROME="$(command -v google-chrome)"
          else
            node "$RUNNER_TEMP/entry-browser/node_modules/playwright/cli.js" install --with-deps chromium
          fi
          node scripts/check-entry-ui.mjs
          node scripts/check-replay-switch-ui.mjs
      - name: Upload entry replay screenshots
        uses: actions/upload-artifact@v4
        with:
          name: oi-entry-browser-checks
          path: ${{ runner.temp }}/entry-ui
          if-no-files-found: error
          retention-days: 30
      - run: python -m pip install -r ../market-core-v3/requirements.txt
      - run: python -m unittest discover -s tests -v
        working-directory: apps/market-core-v3
      - run: python scripts/build_bundle.py --output /tmp/market-workspace-v3.zip
        working-directory: apps/market-core-v3
      - name: Upload deployment bundle
        uses: actions/upload-artifact@v4
        with:
          name: market-workspace-v3-deployment
          path: /tmp/market-workspace-v3.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Build GUI-only update
        run: python scripts/build_gui_update.py --deployment-bundle /tmp/market-workspace-v3.zip --output /tmp/market-workspace-v3-gui-update.zip
        working-directory: apps/market-core-v3
      - name: Upload GUI-only update
        uses: actions/upload-artifact@v4
        with:
          name: market-workspace-v3-gui-update
          path: /tmp/market-workspace-v3-gui-update.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
